<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Bulk KO Finder</title>
		<link rel="icon" type="image/x-icon" href="/static/img/favicon.png" />
		<link
			type="text/css"
			rel="stylesheet"
			href="/static/js/vendor/select2/select2.css"
		/>
		<link type="text/css" rel="stylesheet" href="/static/css/main.css?" />
		<link
			type="text/css"
			rel="stylesheet"
			href="/static/css/vendor/bootstrap.css"
		/>
		<link
			type="text/css"
			rel="stylesheet"
			href="/static/css/dark-theme.css?"
			id="dark-theme-styles"
		/>
		<script
			type="text/javascript"
			src="/static/js/theme-init.js"
		></script>
		<style>
			.bulk-container {
				display: flex;
				gap: 20px;
				padding: 20px;
			}
			.bulk-sidebar {
				width: 350px;
				flex-shrink: 0;
			}
			.bulk-results {
				flex-grow: 1;
			}
			.filter-section {
				margin-bottom: 20px;
				padding: 15px;
				background: #2a2a2a;
				border-radius: 5px;
			}
			.filter-section h3 {
				margin-top: 0;
				margin-bottom: 10px;
				font-size: 16px;
			}
			.filter-group {
				margin-bottom: 10px;
			}
			.filter-group label {
				display: block;
				margin-bottom: 5px;
				font-size: 14px;
			}
			.filter-group input,
			.filter-group select {
				width: 100%;
				padding: 5px;
				box-sizing: border-box;
			}
			.search-btn {
				width: 100%;
				padding: 10px;
				background: #4CAF50;
				color: white;
				border: none;
				border-radius: 5px;
				cursor: pointer;
				font-size: 16px;
			}
			.search-btn:hover {
				background: #45a049;
			}
			.search-btn:disabled {
				background: #666;
				cursor: not-allowed;
			}
			.results-table {
				width: 100%;
				border-collapse: collapse;
				background: #2a2a2a;
				border-radius: 5px;
				overflow: hidden;
			}
			.results-table th,
			.results-table td {
				padding: 10px;
				text-align: left;
				border-bottom: 1px solid #444;
			}
			.results-table th {
				background: #333;
				font-weight: bold;
			}
			.results-table tr:hover {
				background: #3a3a3a;
			}
			.results-count {
				margin-bottom: 10px;
				font-size: 14px;
			}
			.progress-bar {
				width: 100%;
				height: 20px;
				background: #444;
				border-radius: 10px;
				margin-bottom: 10px;
				overflow: hidden;
				display: none;
			}
			.progress-fill {
				height: 100%;
				background: #4CAF50;
				width: 0%;
				transition: width 0.3s;
			}
			.progress-text {
				text-align: center;
				font-size: 12px;
				margin-bottom: 10px;
				display: none;
			}
		</style>
	</head>

	<body class="dark-theme">
		<div class="wrapper">
			<div class="header-section">
				<span class="title-text main-title-text">Bulk KO Finder</span>
				<div aria-label="Navigation" role="region">
					<span class="modeSelection" role="radiogroup">
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-calculator"
						/><label class="btn btn-left btn-wide" for="page-calculator">Calculator</label>
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-search"
						/><label class="btn btn-mid btn-wide" for="page-search">Search</label>
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-bulk-ko"
							checked="checked"
						/><label class="btn btn-mid btn-wide" for="page-bulk-ko">Bulk KO</label>
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-bulk-survive"
						/><label class="btn btn-right btn-wide" for="page-bulk-survive">Bulk Survive</label>
					</span>
				</div>
			</div>
			<hr />

			<div class="bulk-container">
				<div class="bulk-sidebar">
					<div class="filter-section">
						<h3>Defender</h3>
						<div class="filter-group">
							<label for="defender">Pokemon</label>
							<select id="defender"></select>
						</div>
						<div class="filter-group">
							<label for="defender_item">Item</label>
							<select id="defender_item" class="item"></select>
						</div>
						<div class="filter-group">
							<label for="defender_ability">Ability</label>
							<select id="defender_ability" class="ability"></select>
						</div>
					</div>

					<div class="filter-section">
						<h3>Defender EVs</h3>
						<div class="filter-group">
							<label for="defender_hp">HP</label>
							<input type="number" id="defender_hp" placeholder="0" min="0" max="32" />
						</div>
						<div class="filter-group">
							<label for="defender_def">Defense</label>
							<input type="number" id="defender_def" placeholder="0" min="0" max="32" />
						</div>
						<div class="filter-group">
							<label for="defender_spd">Sp. Defense</label>
							<input type="number" id="defender_spd" placeholder="0" min="0" max="32" />
						</div>
					</div>

					<div class="filter-section">
						<h3>Attacker Filters (Optional)</h3>
						<div class="filter-group">
							<label for="filter_type1">Type 1</label>
							<select id="filter_type1">
								<option value="">Any</option>
								<option value="Normal">Normal</option>
								<option value="Fire">Fire</option>
								<option value="Water">Water</option>
								<option value="Electric">Electric</option>
								<option value="Grass">Grass</option>
								<option value="Ice">Ice</option>
								<option value="Fighting">Fighting</option>
								<option value="Poison">Poison</option>
								<option value="Ground">Ground</option>
								<option value="Flying">Flying</option>
								<option value="Psychic">Psychic</option>
								<option value="Bug">Bug</option>
								<option value="Rock">Rock</option>
								<option value="Ghost">Ghost</option>
								<option value="Dragon">Dragon</option>
								<option value="Dark">Dark</option>
								<option value="Steel">Steel</option>
								<option value="Fairy">Fairy</option>
							</select>
						</div>
						<div class="filter-group">
							<label for="filter_min_bst">Min BST</label>
							<input type="number" id="filter_min_bst" placeholder="e.g., 500" min="0" max="720" />
						</div>
						<div class="filter-group">
							<label for="filter_min_spe">Min Speed</label>
							<input type="number" id="filter_min_spe" placeholder="e.g., 100" min="0" max="255" />
						</div>
					</div>

					<div class="filter-section">
						<h3>Attack Options</h3>
						<div class="filter-group">
							<label for="move">Target Move (optional, leave empty for best move)</label>
							<select id="move"></select>
						</div>
						<div class="filter-group">
							<label for="attacker_item">Attacker Item (optional)</label>
							<select id="attacker_item" class="item"></select>
						</div>
						<div class="filter-group">
							<label for="ko_percent">KO Threshold (%)</label>
							<input type="number" id="ko_percent" value="100" min="0" max="100" />
						</div>
						<div class="filter-group">
							<label>
								<input type="checkbox" id="only_super_effective" checked />
								Only check super effective moves (much faster)
							</label>
						</div>
					</div>

					<button class="search-btn" id="searchBtn">Find Attackers</button>
				</div>

				<div class="bulk-results">
					<div class="progress-bar" id="progressBar">
						<div class="progress-fill" id="progressFill"></div>
					</div>
					<div class="progress-text" id="progressText">Processing...</div>
					<div class="results-count" id="resultsCount"></div>
					<table class="results-table">
						<thead>
							<tr>
								<th>Pokemon</th>
								<th>Points Needed</th>
								<th>Best Move</th>
								<th>Ability Required</th>
								<th>Description</th>
							</tr>
						</thead>
						<tbody id="resultsBody">
							<tr>
								<td colspan="5" style="text-align: center;">Configure defender and click Find Attackers</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<script src="/static/js/vendor/jquery-1.9.1.min.js"></script>
		<script src="/static/js/vendor/select2/select2.min.js"></script>
		<script src="/static/js/bulk_ko.js"></script>
	</body>
</html>

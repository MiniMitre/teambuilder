[project]
name = "teambuilder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
]

[project.scripts]
teambuilder = "teambuilder.main:app"
build_db = "teambuilder.data:build"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
